{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
  <div class="col-md-5 col-sm-8">
    <div class="card bg-white shadow-sm p-4">

      <h2 class="text-center mb-4 fw-bold" style="font-size: 1.35rem;">Create an Account</h2>

      {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3" role="alert">
          <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" action="{{ url_for('register') }}">
        <div class="mb-3">
          <label for="name" class="form-label">Full Name</label>
          <input type="text" id="name" name="name" class="form-control"
                 placeholder="e.g. Jane Smith" required autofocus>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" name="email" class="form-control"
                 placeholder="name@example.com" required>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" id="password" name="password" class="form-control"
                   placeholder="Choose a password" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                    aria-label="Show or hide password">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
        </div>
      </form>

      <div class="text-center mt-3 pt-3 border-top">
        <p class="text-muted small mb-0">
          Already registered?
          <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Login here</a>
        </p>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('togglePassword').addEventListener('click', function () {
  const input = document.getElementById('password');
  const icon  = document.getElementById('toggleIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    input.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
});
</script>
{% endblock %}
